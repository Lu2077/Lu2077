name: Generator Stats Profile 2D

on:
  schedule:
    - cron: "0 0 * * *" # Corre automáticamente todas las noches
  workflow_dispatch: # Te permite ejecutarlo manualmente con un botón

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generar Estadísticas de Perfil
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: stats.svg
          base: header, activity, community, repositories, metadata
          config_timezone: America/Santiago # Ajustado a tu zona horaria
          theme: dracula

      - name: Generar Lenguajes más Usados
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: languages.svg
          base: header                       # CAMBIO: Activamos el encabezado mínimo obligatorio
          plugin_languages: yes
          plugin_languages_sections: most-used # CAMBIO: Fuerza a renderizar el gráfico de barras de lenguajes
          plugin_languages_ignored: html, css
          plugin_languages_limit: 7
          config_timezone: America/Santiago
          theme: dracula



