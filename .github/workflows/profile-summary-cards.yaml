name: Generator Stats Profile 2D

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # 1. Estadísticas Generales Compactas (Sin textos gigantes)
      - name: Generar Estadísticas de Perfil
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: stats.png
          config_output: png
          base: header, repositories       # Reducido al mínimo: Solo avatar, nombre y conteo básico
          config_timezone: America/Santiago
          config_theme: dracula

      # 2. Tarjeta de Lenguajes Estilo Gráfico Puro (Sin listas de texto masivas)
      - name: Generar Lenguajes más Usados
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: languages.png
          config_output: png
          base: ""                         # Oculta textos y cabeceras secundarias
          plugin_languages: yes
          plugin_languages_sections: most-used # Muestra estrictamente las barras de porcentaje de colores
          plugin_languages_details: percentage # Solo el porcentaje matemático
          plugin_languages_ignored: html, css
          plugin_languages_limit: 7
          config_timezone: America/Santiago
          config_theme: dracula



