name: Generator Stats Profile 2D

on:
  schedule:
    - cron: "0 0 * * *" # Corre automáticamente todas las noches
  workflow_dispatch: # Te permite ejecutarlo manualmente con un botón

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # 1. Bloque para las Estadísticas Generales
      - name: Generar Estadísticas de Perfil
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: stats.svg
          base: header, activity, community, repositories, metadata
          config_timezone: America/Santiago
          config_theme: dracula              # CORREGIDO: Se cambió 'theme' por 'config_theme'

      # 2. Bloque exclusivo para los Lenguajes Más Usados
      - name: Generar Lenguajes más Usados
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: languages.svg
          base: ""                           # Mantenemos limpio el fondo
          plugin_languages: yes
          plugin_languages_sections: most-used 
          plugin_languages_ignored: html, css
          plugin_languages_limit: 7
          config_timezone: America/Santiago
          config_theme: dracula              # CORREGIDO: Se cambió 'theme' por 'config_theme'




